name: Deploy to 1Panel

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-1panel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync source files and restart MkDocs
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?SERVER_HOST is required}"
          : "${SERVER_USER:?SERVER_USER is required}"
          : "${SERVER_SSH_KEY:?SERVER_SSH_KEY is required}"
          port="${SERVER_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || { echo 'SERVER_PORT must be numeric' >&2; exit 1; }
          command -v rsync >/dev/null

          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$ssh_dir/key"
          ssh-keyscan -T 15 -p "$port" "$SERVER_HOST" > "$ssh_dir/known_hosts"
          ssh_options=(
            -i "$ssh_dir/key" -p "$port"
            -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15
          )
          printf -v rsync_ssh '%q ' ssh "${ssh_options[@]}"
          remote="${SERVER_USER}@${SERVER_HOST}"

          sync_mode=$(ssh "${ssh_options[@]}" "$remote" '
            set -e
            mkdir -p /opt/1panel/apps/mkdocs-material/mkdocs-material/data/
            if command -v rsync >/dev/null 2>&1; then
              printf "rsync\n"
            else
              printf "archive\n"
            fi
          ')

          case "$sync_mode" in
            rsync)
              echo 'Using rsync checksum-based incremental sync.'
              # Checkout timestamps change even for unchanged media.
              # Named sources scope deletions to repository-managed directories.
              rsync --archive --no-owner --no-group --checksum --compress \
                --delete-delay --delay-updates --stats --timeout=120 \
                --exclude='__pycache__/' --exclude='*.pyc' \
                --rsh="$rsync_ssh" \
                docs overrides hooks .git mkdocs.yml requirements.txt \
                "$remote:/opt/1panel/apps/mkdocs-material/mkdocs-material/data/"
              ;;
            archive)
              echo 'Remote rsync is unavailable; using a full archive over SSH.'
              tar -czf "$ssh_dir/site.tar.gz" \
                --exclude='__pycache__' --exclude='*.pyc' \
                docs overrides hooks .git mkdocs.yml requirements.txt
              extract_script=$(cat <<'REMOTE'
          set -eu
          target=/opt/1panel/apps/mkdocs-material/mkdocs-material/data
          stage=$(mktemp -d "$target/.deploy-XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          tar -xzf - -C "$stage"
          for path in docs overrides hooks .git mkdocs.yml requirements.txt; do
            test -e "$stage/$path"
          done
          # Replace only managed paths, after the complete archive has been extracted.
          for path in docs overrides hooks .git mkdocs.yml requirements.txt; do
            rm -rf -- "$target/$path"
            mv -- "$stage/$path" "$target/$path"
          done
          REMOTE
              )
              ssh "${ssh_options[@]}" "$remote" "$extract_script" < "$ssh_dir/site.tar.gz"
              ;;
            *)
              echo 'Unexpected sync mode returned by the deployment server.' >&2
              exit 1
              ;;
          esac

          ssh "${ssh_options[@]}" "$remote" '
            cd /opt/1panel/apps/mkdocs-material/mkdocs-material/ &&
            docker compose restart
          '

      - name: Verify public video range requests
        shell: bash
        env:
          VIDEO_CHECK_URL: https://wiki.bxirobotics.com/assets/elf3/developer/navigation/relocalize-robot-demo.mp4
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          from urllib.request import Request, urlopen

          url = os.environ['VIDEO_CHECK_URL'] + '?deploy=' + os.environ['GITHUB_SHA']
          for attempt in range(12):
              try:
                  request = Request(url, headers={'Range': 'bytes=0-1', 'Cache-Control': 'no-cache'})
                  with urlopen(request, timeout=10) as response:
                      status = response.status
                      content_range = response.headers.get('Content-Range', '')
                      data = response.read(3)
                  if status == 206 and re.fullmatch(r'bytes 0-1/[0-9]+', content_range) and len(data) == 2:
                      print('Public video range check passed: HTTP 206, bytes 0-1.')
                      break
                  print(f'Attempt {attempt + 1}: HTTP {status}, Content-Range={content_range!r}, bytes read={len(data)}')
              except OSError as error:
                  print(f'Attempt {attempt + 1}: {error}')
              if attempt < 11:
                  time.sleep(5)
          else:
              raise SystemExit('Video range check failed. Check the MkDocs startup hook and the ESA/CDN Range forwarding settings.')
          PY
